# Explicit legacy mode: docker compose -f docker-compose.yml -f docker-compose.none.yml up
# Disable broker token auth while retaining Air source mounts and build caches.
services:
  database-broker:
    volumes: !override
      - ./database-broker:/src:ro
      - broker_go_build:/tmp/go-build
    environment:
      AUTH_MODE: none
      AUTH_POLICY_FILE: ""
      AUTH_DEPLOYMENT_ID: ""
      AUTH_KEY_FILES: ""
  access-gateway:
    volumes: !override
      - ./access-gateway:/src:ro
      - gateway_go_build:/tmp/go-build
    environment:
      BROKER_TOKEN_FILE: ""
  files:
    volumes: !override
      - ./files:/src:ro
      - files_go_build:/tmp/go-build
    environment:
      BROKER_TOKEN_FILE: ""
  notes:
    volumes: !override
      - ./notes:/src:ro
      - notes_go_build:/tmp/go-build
    environment:
      BROKER_TOKEN_FILE: ""
  chess:
    volumes: !override
      - ./chess:/src:ro
      - chess_go_build:/tmp/go-build
    environment:
      BROKER_TOKEN_FILE: ""
  sudoku:
    volumes: !override
      - ./sudoku:/src:ro
      - sudoku_go_build:/tmp/go-build
    environment:
      BROKER_TOKEN_FILE: ""
